[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legends-captions"
version = "0.2.0"
description = "Agent-driven caption deployment system with contextual correction, timing policy, and QA manifests."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Avalon Reset" }
]
license = "MIT"
keywords = [
  "video captions",
  "auto captions",
  "subtitle generator",
  "forced alignment",
  "caption QA",
  "active word captions",
  "agentic workflow"
]
dependencies = []

[project.scripts]
legends-captions = "legends_captions.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legends_captions = ["data/*.json"]
